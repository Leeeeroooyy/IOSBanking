# XcodeGen project description.
# The Xcode project (MobileBanking.xcodeproj) is generated from this file
# with `xcodegen generate` and is not committed to Git.
name: MobileBanking

options:
  bundleIdPrefix: cz.mobiletech
  developmentLanguage: cs          # Czech is the source / default language
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # We access colors through Theme.Colors, so no generated asset symbols
    # (they would clash with SwiftUI names such as Color.primary).
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO

targets:
  MobileBanking:
    type: application
    platform: iOS
    sources:
      - path: MobileBanking
    info:
      path: MobileBanking/Info.plist
      properties:
        CFBundleDevelopmentRegion: cs
        CFBundleLocalizations: [cs, en]
        CFBundleDisplayName: Mobile Banking
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # English is in InfoPlist.xcstrings. Without this key Face ID crashes the app.
        NSFaceIDUsageDescription: Face ID odemyká aplikaci Mobile Banking.
        UILaunchScreen:
          UIColorName: AppBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.mobiletech.MobileBanking
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AppPrimary
    scheme:
      testTargets:
        - MobileBankingTests
        - MobileBankingUITests
      gatherCoverageData: true

  MobileBankingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MobileBankingTests
    dependencies:
      - target: MobileBanking
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: cz.mobiletech.MobileBankingTests

  MobileBankingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MobileBankingUITests
    dependencies:
      - target: MobileBanking
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: cz.mobiletech.MobileBankingUITests
        TEST_TARGET_NAME: MobileBanking
