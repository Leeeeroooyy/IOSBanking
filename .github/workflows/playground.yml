name: Swift Playgrounds copy

# Checks that Playgrounds/MobileBanking.swiftpm matches the app code and that it builds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  playground:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: The copy is up to date
        run: |
          python3 scripts/make_playground.py
          if [ -n "$(git status --porcelain Playgrounds)" ]; then
            git status --porcelain Playgrounds
            echo "Playgrounds/ is out of date: run python3 scripts/make_playground.py and commit."
            exit 1
          fi

      - name: Build the app package
        working-directory: Playgrounds/MobileBanking.swiftpm
        run: |
          xcodebuild build \
            -scheme MobileBanking \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO

      - name: Resources are in the app
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name "MobileBanking.app" -maxdepth 2 | head -1)
          echo "App: $APP"
          find "$APP" -maxdepth 3 \( -name "*.lproj" -o -name "Assets.car" -o -name "*.bundle" -o -name "Localizable*" \) | sed "s|$APP/||"
          /usr/libexec/PlistBuddy -c "Print :NSFaceIDUsageDescription" "$APP/Info.plist"

      # A small zip with only the Playgrounds app, always at the same link:
      # https://github.com/Leeeeroooyy/IOSBanking/releases/download/playground-latest/MobileBanking-Playgrounds.zip
      - name: Publish the zip for iPad
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd Playgrounds
          zip -qry "$RUNNER_TEMP/MobileBanking-Playgrounds.zip" MobileBanking.swiftpm
          if ! gh release view playground-latest >/dev/null 2>&1; then
            gh release create playground-latest --prerelease \
              --title "Swift Playgrounds (iPad)" \
              --notes "Latest app for Swift Playgrounds on iPad. Updated automatically with every push to main."
          fi
          gh release upload playground-latest "$RUNNER_TEMP/MobileBanking-Playgrounds.zip" --clobber
